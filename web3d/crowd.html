const t0 = performance.now();

  { name: 'horse', url: F + 'Horse.fbx', clips: ['Idle', 'Walk', 'Run'], h: 2.0 }, { name: 'cow', url: F + 'Cow.fbx', clips: ['Idle', 'Walk', 'Run'], h: 1.5 }, { name: 'sheep', url: F + 'Sheep.fbx', clips: ['Idle', 'Walk', 'Run'], h: 0.9 }];
