<!doctype html>
<meta charset="utf-8"><title>Valley terrain (3D)</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block}
#ui{position:fixed;top:8px;left:8px;color:#fff;font:13px sans-serif;display:flex;gap:6px;align-items:center}
#ui button{padding:3px 10px}#st{opacity:.8}</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>
<div id="ui"><button data-t="dawn">dawn</button><button data-t="noon">noon</button><button data-t="dusk">dusk</button><button data-t="night">night</button><span id="st"></span></div>
<script type="module">
// Terrain from GET /api/map (hills, dunes, wadi polygons) with a deterministic fallback from a seed.
// Open: ./tribes --serve 8080 --web web3d   then   http://127.0.0.1:8080/terrain.html?t=noon
import * as THREE from 'three';
const P = new URLSearchParams(location.search);
const W = 2000, H = 1400, CELL = 5, NX = W / CELL, NY = H / CELL, CH = 20;   // 400 x 280 cells, chunks of 20 x 20
let map = null, src = 'api';
try { map = await (await fetch('/api/map')).json(); } catch (e) { /* fallback below */ }
if (!map || !map.terrain) { src = 'seed fallback'; map = null; }
const seed = map ? map.seed : parseInt(P.get('seed') || '42', 10);
function rnd(s) { return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const R = rnd(seed), lat = new Float32Array(66 * 66).map(() => R());
const noise = (x, y) => {                       // smooth value noise, one octave at scale 1
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const g = (a, b) => lat[((b & 63) * 66) + (a & 63)];
  return (g(xi, yi) * (1 - u) + g(xi + 1, yi) * u) * (1 - v) + (g(xi, yi + 1) * (1 - u) + g(xi + 1, yi + 1) * u) * v;
};
const fbm = (x, y) => noise(x, y) * 0.55 + noise(x * 2.1, y * 2.1) * 0.3 + noise(x * 4.3, y * 4.3) * 0.15;
function inside(pts, x, y) {
  let c = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const a = pts[i], b = pts[j];
    if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
  }
  return c;
}
// coarse masks (1 per 10 units), blurred so the edges are slopes
const MX = W / 10, MY = H / 10, mask = { hills: new Float32Array(MX * MY), dunes: new Float32Array(MX * MY), wadi: new Float32Array(MX * MY) };
if (map) { for (const t of map.terrain) if (mask[t.type]) for (let j = 0; j < MY; j++) for (let i = 0; i < MX; i++) if (inside(t.points, i * 10 + 5, j * 10 + 5)) mask[t.type][j * MX + i] = 1; }
else for (let j = 0; j < MY; j++) for (let i = 0; i < MX; i++) { const x = i / MX, y = j / MY; if (x < 0.12 || x > 0.88 || y < 0.1) mask.hills[j * MX + i] = 1; if (y > 0.8) mask.dunes[j * MX + i] = 1; if (Math.abs(y - 0.5 - 0.1 * Math.sin(x * 6)) < 0.05) mask.wadi[j * MX + i] = 1; }
for (const k in mask) for (let pass = 0; pass < 4; pass++) {
  const m = mask[k], o = new Float32Array(m.length);
  for (let j = 0; j < MY; j++) for (let i = 0; i < MX; i++) { let s = 0, n = 0; for (let dj = -2; dj <= 2; dj++) for (let di = -2; di <= 2; di++) { const a = i + di, b = j + dj; if (a >= 0 && b >= 0 && a < MX && b < MY) { s += m[b * MX + a]; n++; } } o[j * MX + i] = s / n; }
  mask[k] = o;
}
const samp = (m, x, y) => { const fx = Math.min(MX - 1.001, Math.max(0, x / 10 - 0.5)), fy = Math.min(MY - 1.001, Math.max(0, y / 10 - 0.5)), i = fx | 0, j = fy | 0, u = fx - i, v = fy - j;
  return (m[j * MX + i] * (1 - u) + m[j * MX + i + 1] * u) * (1 - v) + (m[(j + 1) * MX + i] * (1 - u) + m[(j + 1) * MX + i + 1] * u) * v; };
function height(x, y) {
  const hills = samp(mask.hills, x, y), dunes = samp(mask.dunes, x, y), wadi = samp(mask.wadi, x, y);
  let h = fbm(x / 400, y / 400) * 6;
  h += hills * (40 + fbm(x / 90, y / 90) * 60);
  h += dunes * (14 + Math.sin(x / 70 + fbm(x / 200, y / 200) * 6) * 9 + Math.sin((x + y) / 45) * 4);
  h -= wadi * 5;
  const e = Math.min(x, y, W - x, H - y) / 80; if (e < 1) h *= Math.max(0, e) * 0.7 + 0.3 * 0;   // edges sink into the haze
  return h;
}
const NVX = NX + 1, NVY = NY + 1, hs = new Float32Array(NVX * NVY);
for (let j = 0; j < NVY; j++) for (let i = 0; i < NVX; i++) hs[j * NVX + i] = height(i * CELL, j * CELL);

const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 1, 6000); cam.position.set(1000, 260, 1500); cam.lookAt(1000, 0, 700);
const tex = await new THREE.TextureLoader().loadAsync('textures/sand_light.png'); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.colorSpace = THREE.SRGBColorSpace;
const mat = new THREE.MeshLambertMaterial({ map: tex, vertexColors: true });
// chunks with two levels of detail: step 1 (5 units) near, step 4 (20 units) far
const chunks = [];
function build(cx, cy, step) {
  const n = CH / step, pos = [], col = [], uv = [], idx = [];
  for (let j = 0; j <= n; j++) for (let i = 0; i <= n; i++) {
    const gi = cx * CH + i * step, gj = cy * CH + j * step, h = hs[gj * NVX + gi];
    pos.push(gi * CELL, h, gj * CELL); uv.push(gi * CELL / 40, gj * CELL / 40);
    const hh = hs[Math.min(NVY - 1, gj + 1) * NVX + gi], hr = hs[gj * NVX + Math.min(NVX - 1, gi + 1)], slope = Math.min(1, Math.hypot(hh - h, hr - h) / CELL / 0.9);
    const dune = samp(mask.dunes, gi * CELL, gj * CELL), wadi = samp(mask.wadi, gi * CELL, gj * CELL), rock = Math.min(1, Math.max(slope * 1.2, h / 70));
    const c = new THREE.Color(1, 0.96, 0.85).lerp(new THREE.Color(0.55, 0.5, 0.46), rock).lerp(new THREE.Color(1.1, 0.9, 0.62), dune * 0.6).lerp(new THREE.Color(0.8, 0.68, 0.5), wadi * 0.5);
    col.push(c.r, c.g, c.b);
  }
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) { const a = j * (n + 1) + i; idx.push(a, a + n + 1, a + 1, a + 1, a + n + 1, a + n + 2); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
for (let cy = 0; cy < NY / CH; cy++) for (let cx = 0; cx < NX / CH; cx++) {
  const m = new THREE.Mesh(build(cx, cy, 1), mat), far = build(cx, cy, 4);
  m.userData = { near: m.geometry, far, c: new THREE.Vector3((cx + 0.5) * CH * CELL, 0, (cy + 0.5) * CH * CELL) }; scene.add(m); chunks.push(m);
}
const sun = new THREE.DirectionalLight(0xffffff, 2), hemi = new THREE.HemisphereLight(0xffffff, 0x886644, 1); scene.add(sun, hemi);
const LIGHT = { // sun elevation (deg), azimuth, sun colour, sky, ground, fog colour, intensity
  dawn: [8, 70, 0xffb070, 0xf2b9a0, 0x6a5a58, 0xe9b89a, 1.3], noon: [70, 160, 0xfff4e0, 0xbfd8f0, 0xb09468, 0xe6dcc4, 2.2],
  dusk: [6, 290, 0xff8a50, 0xe89870, 0x5a4a50, 0xd9946e, 1.2], night: [-20, 0, 0x6070a0, 0x5a6aa0, 0x30304a, 0x151c34, 0.35] };
function setTime(k) {
  const [el, az, sc, sky, gr, fog, it] = LIGHT[k], e = el * Math.PI / 180, a = az * Math.PI / 180;
  sun.position.set(Math.sin(a) * Math.cos(e), Math.max(0.05, Math.sin(e)), Math.cos(a) * Math.cos(e)).multiplyScalar(1000).add(new THREE.Vector3(1000, 0, 700));
  sun.target.position.set(1000, 0, 700); sun.color.set(sc); sun.intensity = el > 0 ? it : 0; hemi.color.set(sky); hemi.groundColor.set(gr); hemi.intensity = k === 'night' ? 1.6 : 1.1;
  scene.background = new THREE.Color(fog); scene.fog = new THREE.Fog(fog, 500, 2600);
  document.getElementById('st').textContent = `${k} | terrain: ${src} | seed ${seed}`;
}
document.querySelectorAll('#ui button').forEach((b) => b.onclick = () => setTime(b.dataset.t));
setTime(P.get('t') || 'noon');
let drag = null, ang = +(P.get('ang') || 0), dist = +(P.get('dist') || 900), tgt = new THREE.Vector3(1000, 0, 700), pit = +(P.get('pit') || 0.55);
r.domElement.onpointerdown = (e) => { drag = [e.clientX, e.clientY]; }; onpointerup = () => { drag = null; };
onpointermove = (e) => { if (drag) { ang -= (e.clientX - drag[0]) * 0.005; pit = Math.min(1.4, Math.max(0.12, pit + (e.clientY - drag[1]) * 0.004)); drag = [e.clientX, e.clientY]; } };
onwheel = (e) => { dist = Math.min(2600, Math.max(60, dist * (1 + e.deltaY * 0.001))); };
let frames = 0, t0 = performance.now(), lod = 0;
r.setAnimationLoop(() => {
  cam.position.set(tgt.x + Math.sin(ang) * Math.cos(pit) * dist, tgt.y + Math.sin(pit) * dist + 10, tgt.z + Math.cos(ang) * Math.cos(pit) * dist); cam.lookAt(tgt);
  lod = 0; for (const m of chunks) { const far = m.userData.c.distanceTo(cam.position) > 700; const g = far ? m.userData.far : m.userData.near; if (m.geometry !== g) m.geometry = g; lod += far ? 0 : 1; }
  r.render(scene, cam); frames++;
  if (performance.now() - t0 > 1000) { window.__t = { fps: frames, nearChunks: lod, tris: r.info.render.triangles, calls: r.info.render.calls }; frames = 0; t0 = performance.now(); }
});
window.__ready = true;
</script>
